services:
  app:
    build: .
    container_name: docker-lab-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: dockerlab
      DB_PASSWORD: dockerlab_password
      DB_NAME: dockerlab_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: docker-lab-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: dockerlab_db
      MYSQL_USER: dockerlab
      MYSQL_PASSWORD: dockerlab_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
